<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>พิมพ์เอกสาร</title>
  <link rel="icon" type="image/svg+xml" href="./assets/logo-placeholder.svg">
  <link rel="stylesheet" href="./css/print.css?v=4.1.31">
</head>
<body>
  <div class="print-toolbar">
    <span id="page-count" class="page-count">กำลังคำนวณหน้า A4…</span>
    <label>รูปแบบสี <select id="print-mode-select"><option value="color">สีอ่อนตามประเภทเอกสาร</option><option value="mono">ขาวดำ</option></select></label>
    <label>การแสดงวันที่ <select id="print-date-select"><option value="show">แสดงวันที่ปกติ</option><option value="hide">ไม่แสดงวันที่</option><option value="dots">แสดงเป็นเส้นประ (........)</option></select></label>

    <!-- ===== เอกสารแนบ (จะแสดงเฉพาะ QT) ===== -->
    <span id="attach-panel" class="attach-panel hidden">
      <span class="attach-panel-label"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg> แนบเอกสาร:</span>
      <label class="attach-check-label" id="attach-label-id-card">
        <input type="checkbox" id="attach-cb-id-card" data-attach-cb="id-card"> สำเนาบัตรประชาชน
        <span id="attach-warn-id-card" class="attach-cb-warn hidden">⚠️ หมดอายุ</span>
      </label>
      <label class="attach-check-label" id="attach-label-commercial-reg">
        <input type="checkbox" id="attach-cb-commercial-reg" data-attach-cb="commercial-reg"> ทะเบียนพาณิชย์
      </label>
      <label class="attach-check-label" id="attach-label-sme-gp">
        <input type="checkbox" id="attach-cb-sme-gp" data-attach-cb="sme-gp"> หนังสือรับรอง SME-GP
        <span id="attach-warn-sme-gp" class="attach-cb-warn hidden">⚠️ หมดอายุ</span>
      </label>
    </span>

    <button id="excel-button" class="excel-button" type="button">ส่งออก Excel สำหรับแก้ไข</button>
    <button id="print-button" type="button">พิมพ์ / บันทึก PDF</button>
    <button id="edit-doc-button" class="edit-button" type="button">แก้ไขเอกสาร</button>
    <button onclick="window.close()">ปิด</button>
  </div>
  <aside id="page-warning" class="page-warning hidden"></aside>
  <main id="print-document" class="page-stack"><section class="a4-sheet"><p>กำลังโหลดเอกสาร...</p></section></main>
  <script src="./config.js"></script>
  <script src="./vendor/exceljs.min.js"></script>
  <!-- PDF.js สำหรับ render เอกสารแนบ PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>
  <script type="module" src="./js/print.js?v=4.1.31"></script>
</body>
</html>
